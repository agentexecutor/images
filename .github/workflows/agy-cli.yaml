name: agy-cli

on:
  pull_request:
    paths:
      - 'agy-cli/**'
      - '.github/workflows/agy-cli.yaml'
  push:
    branches: [main]
    paths:
      - 'agy-cli/**'
      - '.github/workflows/agy-cli.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Launcher unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test ax-launcher
        run: agy-cli/test_harness.sh

  build-and-verify:
    name: Build & verify (${{ matrix.arch }})
    needs: unit-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify the image
        run: |
          img="ax-agy-cli:${{ matrix.arch }}"
          docker build -t "${img}" agy-cli
          agy-cli/verify_image.sh "${img}"
